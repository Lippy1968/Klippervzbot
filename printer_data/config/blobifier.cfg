#####################################################################
#                 BLOBIFIER SERVO & PURGE MACROS                    #
#####################################################################

[servo blobifier_servo]
pin: PC6
maximum_servo_angle: 180
minimum_pulse_width: 0.001
maximum_pulse_width: 0.002
initial_angle: 180          # Parks/tucks arm on startup


[gcode_macro _BLOBIFIER_VARS]
variable_purge_x: 330     # X coordinate over the purge bucket
variable_purge_y: 52.12       # Y coordinate over the purge bucket
variable_purge_z: 5.0       # Z height above nozzle clearance
variable_servo_retracted: 180 # Parked/Tucked position
variable_servo_deployed: 0    # Deployed/Flick position
variable_purge_length: 30     # Default mm of filament to purge
variable_purge_spd: 250       # Purge speed (mm/min)
variable_travel_spd: 12000    # Travel speed to bucket (mm/min)
gcode:
    # Storage container for variables

# -------------------------------------------------------------------
# HELPER MACROS: SERVO CONTROL WITH AUTO-SHUTOFF
# -------------------------------------------------------------------

[gcode_macro BLOBIFIER_PARK]
description: Tuck the Blobifier arm away and kill signal to stop buzzing
gcode:
    {% set vars = printer["gcode_macro _BLOBIFIER_VARS"] %}
    SET_SERVO SERVO=blobifier_servo ANGLE={vars.servo_retracted}
    G4 P600                         # Wait 600ms for mechanical movement to complete
    SET_SERVO SERVO=blobifier_servo WIDTH=0 # Cut signal/power to stop buzzing

[gcode_macro BLOBIFIER_DEPLOY]
description: Extend the Blobifier arm and kill signal to stop buzzing
gcode:
    {% set vars = printer["gcode_macro _BLOBIFIER_VARS"] %}
    SET_SERVO SERVO=blobifier_servo ANGLE={vars.servo_deployed}
    G4 P600                         # Wait 600ms for mechanical movement to complete
    SET_SERVO SERVO=blobifier_servo WIDTH=0 # Cut signal/power to stop buzzing

# -------------------------------------------------------------------
# MAIN PURGE & FLICK ROUTINE
# -------------------------------------------------------------------

[gcode_macro BLOBIFIER]
description: Move to bucket, purge a blob, cool, flick, and park
gcode:
    {% set vars = printer["gcode_macro _BLOBIFIER_VARS"] %}
    
    # Check if homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=BLOBIFIER_STATE
    
    # 1. Lift Z slightly for clearance if needed
    {% if printer.toolhead.position.z < vars.purge_z %}
        G1 Z{vars.purge_z} F3000
    {% endif %}

    # 2. Move to Purge Bucket Position
    G90
    G1 X{vars.purge_x} Y{vars.purge_y} F{vars.travel_spd}

    # 3. Purge Filament (Form the Blob)
    M83                            # Relative extrusion mode
    G1 E{vars.purge_length} F{vars.purge_spd}
    
    # 4. Cooling Pause (Lets plastic solidify so it drops cleanly)
    G4 P3000                        # Wait 3 seconds
    
    # 5. The Flick!
    BLOBIFIER_DEPLOY
    
    # 6. Small delay while deployed, then retract
    G4 P500
    BLOBIFIER_PARK

    # 7. Final Wipe/Retract away
    G1 E-1.0 F1800                  # Tiny retract to prevent drool
    RESTORE_GCODE_STATE NAME=BLOBIFIER_STATE